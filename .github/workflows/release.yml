name: Release & Distribute Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm-publish:
    name: Publish NPM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout NPM submodule repo
        run: |
          git submodule update --init --recursive 2>/dev/null || true
          if [ ! -f "regex-npm/package.json" ]; then
            rm -rf regex-npm
            git clone https://github.com/regex-to/validators.git --branch main regex-npm || git clone https://github.com/regex-to/validators-npm.git regex-npm
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to NPM
        run: |
          cd regex-npm
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm install
          npm publish || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  split-php:
    name: Monorepo Split PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare PHP Package
        run: |
          mkdir -p regex-php/patterns
          cp -r patterns/* regex-php/patterns/
      - name: Split and Push
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'regex-php'
          repository_organization: 'regex-to'
          repository_name: 'validators-php'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  split-go:
    name: Monorepo Split Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Go Package
        run: |
          mkdir -p regex-go/patterns
          cp -r patterns/* regex-go/patterns/
      - name: Split and Push
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'regex-go'
          repository_organization: 'regex-to'
          repository_name: 'validators-go'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  split-rust:
    name: Monorepo Split Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Rust Package
        run: |
          mkdir -p regex-rust/patterns
          cp -r patterns/* regex-rust/patterns/
      - name: Split and Push
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'regex-rust'
          repository_organization: 'regex-to'
          repository_name: 'regex-rust'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  split-python:
    name: Monorepo Split Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Python Package
        run: |
          mkdir -p regex-python/src/regexto_validators/patterns
          cp -r patterns/* regex-python/src/regexto_validators/patterns/
      - name: Split and Push
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'regex-python'
          repository_organization: 'regex-to'
          repository_name: 'validators-python'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}


